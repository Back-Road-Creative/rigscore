name: Release

# Triggered by a package.json version bump on main.
# Single workflow — no cross-workflow event chain, no GITHUB_TOKEN trigger gap.
#
# Steps: test → GitHub release (facts snapshot attached as a release asset)
# → pull request pinning the Homebrew formula to the new release tag
# Distribution: GitHub only (npx github:Back-Road-Creative/rigscore)
# The consuming site's facts data file is refreshed downstream, in that repo,
# by a workflow there that pulls from this repo's public releases.

on:
  push:
    branches: [main, master]
    paths: ['package.json']
  # rc/beta/alpha tags never reach this workflow: it fires only on a
  # package.json version bump, and rc tags do not bump package.json. rc site
  # posts are therefore hand-authored by design (release-provenance.yml still
  # signs the rc tag).
  workflow_dispatch:   # manual re-trigger after tag/release cleanup

jobs:
  release:
    name: Test and release
    # GitHub-hosted (JP 2026-09-21). The org's self-hosted runner groups have
    # allows_public_repositories=false, so `runs-on: self-hosted` on this PUBLIC
    # repo never got a runner: the 2026-09-10 and 2026-09-12 Release runs sat
    # queued 24h and were cancelled. Hosted minutes are free for public repos.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # `actions: write` is what lets the "Trigger tag-scoped workflows" step
      # below call the workflow-dispatch API. Without it that step 403s with
      # "Resource not accessible by integration" — `contents: write` does NOT
      # cover dispatching a workflow.
      #
      # This was latent from the day the step was written: it is guarded by
      # `if: steps.check.outputs.exists == 'false'`, so every earlier release
      # run SKIPPED it (they were re-triggers against an already-existing
      # release) and the gap never surfaced. It first executed on v2.2.0 and
      # failed, leaving the release and tag published but no container image
      # built and no provenance attested. That is also why GHCR `:latest` went
      # stale: the automated path has never once published an image, so every
      # image in the registry came from a manual dispatch.
      actions: write
      # Lets the formula-bump step open its pull request.
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if already released (idempotent)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.pkg.outputs.version }}" \
               --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.pkg.outputs.version }} already released — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      - name: Run tests
        if: steps.check.outputs.exists == 'false'
        env:
          FORBIDDEN_EXTRA: ${{ secrets.FORBIDDEN_EXTRA }}
        run: npm test

      # docs-first gate: same blocking check ci.yml runs. Without it, a
      # release branch could ship a check whose docs/checks/<id>.md is
      # missing or stale — the user-facing `rigscore explain <findingId>`
      # would then break against the just-released artifact.
      - name: Verify check docs
        if: steps.check.outputs.exists == 'false'
        run: npm run verify:docs

      - name: Build changelog
        # Feeds the GitHub release notes. (Release notes retired from the site
        # with its /releases/ section — the site validator (2026-07-27) that
        # once checked this output no longer applies here.)
        if: steps.check.outputs.exists == 'false'
        id: changelog
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          # --exclude the version being released. On a normal run its tag does
          # not exist yet, so a bare `describe` correctly returns the previous
          # release. On a re-dispatch after the tag already exists, a bare
          # `describe` would return the current version and the range would
          # collapse to "vX..vX" — an empty changelog.
          PREV_TAG=$(git describe --tags --abbrev=0 --exclude "v${VERSION}" 2>/dev/null || echo "")
          # Prefer the curated `## [<version>]` section the maintainer folded into
          # CHANGELOG.md in the version-bump PR (assemble-changelog --release). Fall
          # back to the raw git log only when that section is absent — zero regression.
          NOTES="$(node scripts/assemble-changelog.js --notes "$VERSION")"
          if [ -n "$NOTES" ]; then
            LOG="$NOTES"
          elif [ -n "$PREV_TAG" ]; then
            LOG=$(git log --oneline "${PREV_TAG}..HEAD" --no-merges)
          else
            LOG=$(git log --oneline --no-merges | head -20)
          fi
          # The notes reach the release step as a file, never as a step output:
          # a commit subject (PR titles are untrusted text) equal to a heredoc
          # delimiter would end an output value early and inject further keys.
          NOTES_FILE="${RUNNER_TEMP}/release-notes.txt"
          printf '%s\n' "$LOG" > "$NOTES_FILE"
          {
            echo "notes_file=${NOTES_FILE}"
            echo "prev_tag=${PREV_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_FILE: ${{ steps.changelog.outputs.notes_file }}
        run: |
          gh release create "v${{ steps.pkg.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --title "rigscore v${{ steps.pkg.outputs.version }}" \
            --notes-file "$NOTES_FILE"
          echo "Created release v${{ steps.pkg.outputs.version }}"

      # Attach the machine-readable facts snapshot to the release. This is the
      # authoritative fact set (version, date, check/scored/advisory counts,
      # per-check {id,weight,category,grade}, enforcement-grade split,
      # frameworks, exit codes, CLI flags) every downstream site surface —
      # homepage count/version, JSON-LD softwareVersion, docs check tables — is
      # rendered from. The site facts sync, which now lives downstream in the
      # site repo and pulls from this repo's public releases, regenerates the
      # same fact set from this asset. Generated here, where npm ci already ran.
      - name: Attach facts snapshot to release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          node scripts/generate-facts.js --out rigscore-facts.json
          gh release upload "v${VERSION}" rigscore-facts.json \
            --repo "${{ github.repository }}" --clobber

      # The v<version> tag `gh release create` just made was pushed with the
      # job's GITHUB_TOKEN, and GitHub does NOT re-trigger `push: tags`
      # workflows from a GITHUB_TOKEN-created tag (anti-recursion). So
      # docker-publish.yml and release-provenance.yml never fired on the
      # canonical release path. workflow_dispatch is the exception a
      # GITHUB_TOKEN CAN trigger — dispatch them ON THE TAG (`--ref`) so both
      # build/attest the released tag's tree, not main-at-dispatch. The
      # normalized (`v`-stripped) tag is passed so docker-publish tags the
      # image `<version>` + `latest`, matching the tag-push contract.
      #
      # The same gap hit prebuilt-binaries.yml: a release created with the job
      # token never fires its `release: published` trigger, so no release had
      # its archives attached. It is dispatched too, with the `v`-prefixed tag
      # its input expects.
      - name: Trigger tag-scoped workflows (docker, provenance, archives)
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          gh workflow run docker-publish.yml --repo "${{ github.repository }}" \
            --ref "v${VERSION}" -f tag="${VERSION}" -f push=true
          gh workflow run release-provenance.yml --repo "${{ github.repository }}" \
            --ref "v${VERSION}"
          gh workflow run prebuilt-binaries.yml --repo "${{ github.repository }}" \
            --ref "v${VERSION}" -f tag="v${VERSION}"

      # Keep the Homebrew formula pinned to the release just published. The
      # tag tarball only exists once `gh release create` has made the tag, so
      # the pin can only follow the release, never ride in the same PR as the
      # version bump. The change goes through a pull request (the base branch
      # is protected); test/meta-ci-contract.test.js accepts a pin that lags
      # package.json and rejects one that runs ahead of it.
      #
      # Two GITHUB_TOKEN limits shape this step. Pushes and PRs it makes never
      # trigger ci.yml, so the step dispatches ci.yml on the bump branch to
      # give the PR its required checks. And a repo can forbid Actions from
      # opening pull requests ("Allow GitHub Actions to create and approve
      # pull requests"); then the branch is pushed but no PR exists. The step
      # is best effort so a published release is never marked failed, but it
      # always leaves a ::warning:: and a job-summary entry saying what to do.
      - name: Bump Homebrew formula pin
        if: steps.check.outputs.exists == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/v${VERSION}.tar.gz"
          SHA=$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)
          if grep -q "tags/v${VERSION}.tar.gz" Formula/rigscore.rb \
             && grep -q "${SHA}" Formula/rigscore.rb; then
            echo "Formula already pinned to v${VERSION}."
            exit 0
          fi
          sed -i -E \
            -e "s#archive/refs/tags/v[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz#archive/refs/tags/v${VERSION}.tar.gz#" \
            -e "s#^(  sha256 \")[0-9a-f]{64}(\")#\1${SHA}\2#" \
            Formula/rigscore.rb
          if ! grep -q "tags/v${VERSION}.tar.gz" Formula/rigscore.rb \
             || ! grep -q "${SHA}" Formula/rigscore.rb; then
            echo "::error::Formula/rigscore.rb layout changed; the url/sha256 edit did not apply."
            exit 1
          fi
          BRANCH="chore/formula-v${VERSION}"
          TITLE="chore(formula): pin Homebrew formula to v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Formula/rigscore.rb
          git commit -m "$TITLE"
          git push origin "$BRANCH"
          gh workflow run ci.yml --repo "${{ github.repository }}" --ref "$BRANCH"
          if ! gh pr create --repo "${{ github.repository }}" --base "${{ github.ref_name }}" --head "$BRANCH" \
            --title "$TITLE" \
            --body "Automated: points Formula/rigscore.rb at the v${VERSION} release tarball and its sha256."; then
            MSG="Pushed ${BRANCH} but could not open the pull request. Open it by hand, or enable Settings > Actions > General > Allow GitHub Actions to create and approve pull requests. Pin: url ${URL} sha256 ${SHA}"
            echo "::warning::${MSG}"
            echo "### Formula pin needs a pull request" >> "$GITHUB_STEP_SUMMARY"
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # The release-facts sync that used to run here (a second job that
      # cloned the consuming site repo with a cross-repo token and opened a
      # PR against it) moved downstream: the site repo now runs its own
      # pull-based workflow that watches this repo's public releases and
      # regenerates its facts data file from the attached facts snapshot
      # above. Nothing in this repo pushes into another repo anymore.
