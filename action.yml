name: 'rigscore'
description: 'AI dev environment hygiene checker — scan and score your configuration security'
author: 'Joe Petrucelli'

# GitHub Marketplace listing metadata. `icon` is a Feather icon from GitHub's
# allowed set; `color` is one of GitHub's eight documented brand colors.
branding:
  icon: 'shield'
  color: 'green'

inputs:
  path:
    description: 'Directory to scan (the scan root)'
    required: false
    default: '.'
  fail-under:
    description: 'Minimum score threshold (exit 1 if below)'
    required: false
    default: '70'
  profile:
    description: 'Scoring profile (default, minimal, ci, home, monorepo)'
    required: false
    default: 'default'
  check:
    description: 'Limit the scan to one check id, or a comma-separated list (e.g. mcp-config or claude-settings,git-hooks). Valid ids are the page names under docs/checks/ in the rigscore repo. Empty runs every check.'
    required: false
    default: ''
  recursive:
    description: 'Enable recursive scanning for monorepos'
    required: false
    default: 'false'
  depth:
    description: 'Recursion depth (implies recursive)'
    required: false
    default: '1'
  deep:
    description: 'Enable deep source secret scanning'
    required: false
    default: 'false'
  online:
    description: 'Allow the online MCP-registry refresh (default is fully offline)'
    required: false
    default: 'false'
  ignore:
    description: 'Comma-separated finding ids / patterns to suppress (same as --ignore)'
    required: false
    default: ''
  baseline:
    description: 'Path to a baseline file: gate on findings NEW since the baseline (same as --baseline)'
    required: false
    default: ''
  upload-sarif:
    description: 'Upload SARIF results to GitHub Advanced Security'
    required: false
    default: 'false'

outputs:
  score:
    description: 'Overall hygiene score (0-100). Empty in --recursive mode when there is no single aggregate score.'
    value: ${{ steps.scan.outputs.score }}
  grade:
    description: 'Letter grade derived from the score (A>=90, B>=75, C>=60, D>=40, else F); see src/reporter.js getGrade.'
    value: ${{ steps.scan.outputs.grade }}
  sarif-file:
    description: 'Absolute path to the emitted SARIF file. Produced only when upload-sarif is true.'
    value: ${{ steps.sarif.outputs.sarif-file }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20'

    # Validate that the caller pinned to a tag (vX.Y.Z), not a branch.
    # Floating refs like `@main` let any default-branch compromise flow
    # into every consumer — refuse and instruct the caller to pin.
    - name: Validate pinned ref
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
      run: |
        if [ -z "${ACTION_REF}" ]; then
          echo "::error::github.action_ref is empty. Pin this action to a tag, e.g. Back-Road-Creative/rigscore@v1.0.0." >&2
          exit 1
        fi
        if ! printf '%s' "${ACTION_REF}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$'; then
          echo "::error::github.action_ref='${ACTION_REF}' is not a semver tag. Pin to a tag like @v1.0.0 — branches and floating refs are rejected to prevent supply-chain drift." >&2
          exit 1
        fi

    # Check out the rigscore source at the ref the caller pinned
    # (e.g. Back-Road-Creative/rigscore@v1.0.0 → clones v1.0.0 here).
    # `github.action_ref` resolves to the ref used in the caller's `uses:` line
    # and has been tag-validated in the previous step.
    # actions/checkout forces `path:` under $GITHUB_WORKSPACE, so a true sibling
    # is impossible — this lands in a `.rigscore-action-src` SUBDIRECTORY of the
    # scan root. deep-secrets' SKIP_DIRS excludes that dir from `--deep` scans so
    # rigscore's own source never pollutes the caller's results.
    - name: Check out rigscore source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: Back-Road-Creative/rigscore
        ref: ${{ github.action_ref }}
        path: .rigscore-action-src

    - name: Install rigscore dependencies
      shell: bash
      working-directory: .rigscore-action-src
      run: npm ci --no-audit --no-fund

    # ONE scan. rigscore emits its score in --json and exits non-zero when the
    # score breaches --fail-under; we capture that exit code and REUSE it as the
    # job gate (the "Enforce threshold" step below), instead of running the whole
    # scan a second time just to re-derive an exit code we already had. Inputs are
    # passed through env (not `${{ }}` interpolated into the script) so a value
    # with shell metacharacters cannot execute in the runner.
    - name: Run rigscore
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        FAIL_UNDER: ${{ inputs.fail-under }}
        PROFILE: ${{ inputs.profile }}
        CHECK: ${{ inputs.check }}
        RECURSIVE: ${{ inputs.recursive }}
        DEPTH: ${{ inputs.depth }}
        DEEP: ${{ inputs.deep }}
        ONLINE: ${{ inputs.online }}
        IGNORE: ${{ inputs.ignore }}
        BASELINE: ${{ inputs.baseline }}
      run: |
        set -uo pipefail
        ARGS=(--fail-under "$FAIL_UNDER" --profile "$PROFILE")
        [ "$RECURSIVE" = "true" ] && ARGS+=(--recursive --depth "$DEPTH")
        [ "$DEEP" = "true" ] && ARGS+=(--deep)
        [ "$ONLINE" = "true" ] && ARGS+=(--online)
        [ -n "$CHECK" ] && ARGS+=(--check "$CHECK")
        [ -n "$IGNORE" ] && ARGS+=(--ignore "$IGNORE")
        [ -n "$BASELINE" ] && ARGS+=(--baseline "$BASELINE")
        # Persist the arg vector so the optional SARIF emit reuses it verbatim.
        printf '%s\n' "${ARGS[@]}" > "$RUNNER_TEMP/rigscore-args"
        set +e
        node "$GITHUB_WORKSPACE/.rigscore-action-src/bin/rigscore.js" "${ARGS[@]}" --json "$SCAN_PATH" > "$RUNNER_TEMP/rigscore.json"
        code=$?
        set -e
        # Parse the score and derive the grade (thresholds mirror src/reporter.js
        # getGrade). A crash leaves the JSON unparseable → empty score/grade; the
        # captured exit code still gates.
        parsed=$(node -e '
          const fs = require("fs");
          let d = {};
          try { d = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); } catch {}
          const s = typeof d.score === "number" ? d.score : null;
          const g = s === null ? "" : s >= 90 ? "A" : s >= 75 ? "B" : s >= 60 ? "C" : s >= 40 ? "D" : "F";
          process.stdout.write((s === null ? "" : s) + "\t" + g);
        ' "$RUNNER_TEMP/rigscore.json")
        score=${parsed%%$'\t'*}
        grade=${parsed##*$'\t'}
        {
          echo "score=$score"
          echo "grade=$grade"
          echo "exit-code=$code"
        } >> "$GITHUB_OUTPUT"
        if [ "$code" -ge 2 ]; then
          echo "::error::rigscore scan did not complete (exit $code)"
          head -c 2000 "$RUNNER_TEMP/rigscore.json" >&2 || true
        fi
        echo "rigscore: score ${score:-n/a} (grade ${grade:-n/a}), threshold ${FAIL_UNDER}, exit ${code}"

    # Job summary: a readable Markdown report on the run page (and in the PR
    # checks UI) instead of a wall of JSON in the log. Runs even when the scan
    # failed so the failure is explained. Inputs reach the program through env,
    # never interpolated into the script. It never fails the job: the gate below
    # owns the exit code.
    - name: Write job summary
      if: always()
      shell: bash
      env:
        RIGSCORE_JSON: ${{ runner.temp }}/rigscore.json
        SCAN_EXIT: ${{ steps.scan.outputs.exit-code }}
        FAIL_UNDER: ${{ inputs.fail-under }}
        BASELINE: ${{ inputs.baseline }}
      run: |
        node - <<'RIGSCORE_SUMMARY' || true
        const fs = require('fs');
        const out = process.env.GITHUB_STEP_SUMMARY;
        if (!out) process.exit(0);
        const code = process.env.SCAN_EXIT || '';
        const failUnder = process.env.FAIL_UNDER || '';
        const esc = (v) => String(v == null ? '' : v)
          .replace(/\s+/g, ' ').trim()
          .replace(/[\\`*_|<>]/g, (c) => ({ '<': '&lt;', '>': '&gt;' }[c] || '\\' + c));
        // Values inside a backtick code span: Markdown processes no backslash
        // escapes there, so only strip what would close the span.
        const cs = (v) => String(v == null ? '' : v).replace(/\s+/g, ' ').trim().replace(/`/g, "'");
        let d = null;
        try { d = JSON.parse(fs.readFileSync(process.env.RIGSCORE_JSON, 'utf8')); } catch {}
        const L = ['## rigscore', ''];
        if (!d || (code !== '' && Number(code) >= 2)) {
          L.push(`The scan did not complete (exit ${esc(code || 'unknown')}). See the job log for the error.`);
          fs.appendFileSync(out, L.join('\n') + '\n');
          process.exit(0);
        }
        const recursive = Array.isArray(d.projects);
        const failed = code !== '' && code !== '0';
        const score = typeof d.score === 'number' ? d.score : null;
        // Exit 1 has three causes; name the right one. Recursive mode fails when
        // ANY scored project is under the threshold, whatever the average; a
        // baseline run fails on findings new since the baseline, whatever the score.
        const limit = Number(failUnder);
        const scoredProjects = recursive ? d.projects.filter((p) => !p.notApplicable && typeof p.score === 'number') : [];
        const under = scoredProjects.filter((p) => p.score < limit);
        let reason;
        if (recursive && under.length) {
          reason = `FAIL, ${under.length} project${under.length === 1 ? '' : 's'} below the threshold of ${esc(failUnder)}: ` +
            under.slice(0, 10).map((p) => '`' + cs(p.path) + '`').join(', ') +
            (under.length > 10 ? `, and ${under.length - 10} more` : '');
        } else if (process.env.BASELINE) {
          reason = 'FAIL, new findings since the baseline';
        } else {
          reason = 'FAIL, below the threshold of ' + esc(failUnder);
        }
        L.push(
          `**Score:** ${score === null ? 'n/a' : score + '/100'}` +
          `  **Grade:** ${esc(d.grade || 'n/a')}` +
          `  **Threshold:** ${esc(failUnder)}` +
          `  **Result:** ${failed ? reason : 'pass'}`,
          '');
        const rank = { critical: 0, warning: 1 };
        const rows = [];
        const projects = recursive ? d.projects : [{ path: '', results: d.results || [] }];
        if (recursive) {
          L.push('### Projects', '', '| Project | Score | Grade |', '| --- | --- | --- |');
          for (const p of d.projects) {
            L.push(`| ${esc(p.path)} | ${typeof p.score === 'number' && !p.notApplicable ? p.score : 'n/a'} | ${esc(p.grade || 'n/a')} |`);
          }
          L.push('');
          // Computed here, not taken from d.worstProject, which can be an N/A project.
          const worst = scoredProjects.reduce((a, p) => (a === null || p.score < a.score ? p : a), null);
          if (worst) {
            L.push(`Worst project: \`${cs(worst.path)}\` (${worst.score}/100)`, '');
          }
        }
        let clean = 0;
        const checkRows = [];
        for (const p of projects) {
          for (const r of p.results || []) {
            if (typeof r.score !== 'number' || r.score < 0) continue;
            const f = r.findings || [];
            const n = (sev) => f.filter((x) => x.severity === sev).length;
            if (r.score >= 100 && !n('critical') && !n('warning')) { clean++; continue; }
            checkRows.push({ proj: p.path, id: r.id, score: r.score, c: n('critical'), w: n('warning'), i: n('info') });
            for (const x of f) {
              if (x.severity in rank) rows.push({ proj: p.path, check: r.id, sev: x.severity, f: x });
            }
          }
        }
        checkRows.sort((a, b) => a.score - b.score);
        if (checkRows.length) {
          L.push('### Checks needing attention', '', `| ${recursive ? 'Project | ' : ''}Check | Score | Critical | Warning | Info |`,
            `| ${recursive ? '--- | ' : ''}--- | --- | --- | --- | --- |`);
          for (const r of checkRows.slice(0, 30)) {
            L.push(`| ${recursive ? esc(r.proj) + ' | ' : ''}${esc(r.id)} | ${r.score} | ${r.c} | ${r.w} | ${r.i} |`);
          }
          if (checkRows.length > 30) L.push('', `...and ${checkRows.length - 30} more checks.`);
          L.push('');
        }
        if (rows.length) {
          rows.sort((a, b) => rank[a.sev] - rank[b.sev]);
          L.push('### Findings', '');
          for (const r of rows.slice(0, 25)) {
            const where = recursive ? `${esc(r.proj)}: ` : '';
            const rem = r.f.remediation ? ` Fix: ${esc(r.f.remediation)}` : '';
            L.push(`- **${r.sev}** ${where}\`${cs(r.f.findingId || r.check)}\` ${esc(r.f.title)}.${rem}`);
          }
          if (rows.length > 25) L.push('', `...and ${rows.length - 25} more critical and warning findings. Run rigscore locally for the full list.`);
          L.push('');
        }
        if (clean) L.push(`${clean} checks passed clean.`, '');
        fs.appendFileSync(out, L.join('\n') + '\n');
        RIGSCORE_SUMMARY

    # SARIF is a distinct artifact (a different output format), emitted only when
    # a consumer actually wants to upload it — so the default path stays a single
    # scan. It reuses the exact arg vector from the scan step above.
    - name: Emit SARIF
      id: sarif
      if: inputs.upload-sarif == 'true'
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
      run: |
        set -uo pipefail
        mapfile -t ARGS < "$RUNNER_TEMP/rigscore-args"
        SARIF="$GITHUB_WORKSPACE/rigscore-results.sarif"
        node "$GITHUB_WORKSPACE/.rigscore-action-src/bin/rigscore.js" "${ARGS[@]}" --ci "$SCAN_PATH" > "$SARIF" || true
        echo "sarif-file=$SARIF" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: rigscore-results.sarif

    # Gate on the SINGLE scan's exit code — no second full scan.
    - name: Enforce threshold
      shell: bash
      run: |
        code="${{ steps.scan.outputs.exit-code }}"
        exit "${code:-2}"
